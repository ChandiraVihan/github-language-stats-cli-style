version: '3.8'

services:
  manim:
    build: .
    volumes:
      - ./:/manim
      # Remove the output volume override - let manim write to default location
    environment:
      - GH_TOKEN=${GH_TOKEN}
      - USERNAME=${USERNAME}
    # Override entrypoint to run full pipeline
    command: >
      sh -c "node fetch-data.js &&
             manim -qh solar_system.py GitHubSolarSystem &&
             mv media/videos/solar_system/1080p60/GitHubSolarSystem.mp4 stats.mp4"