name: Render Stats

on:
  workflow_dispatch:
    inputs:
      username:
        required: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Fetch GitHub data
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          USERNAME: ${{ github.event.inputs.username }}
        run: |
          mkdir -p manim
          curl -s -H "Authorization: bearer $GH_TOKEN" \
               -X POST \
               -d "{\"query\":\"query(\$u:String!){user(login:\$u){name bio repositories(first:100,ownerAffiliations:OWNER,isFork:false){nodes{languages(first:10,orderBy:{field:SIZE,direction:DESC}){edges{size node{name color}}}}}}}\",\"variables\":{\"u\":\"$USERNAME\"}}" \
               https://api.github.com/graphql > /tmp/data.json
          
          node -e "
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('/tmp/data.json'));
            const repos = data.data.user.repositories.nodes;
            const langs = {};
            repos.forEach(r => {
              r.languages?.edges?.forEach(e => {
                const n = e.node.name;
                if (!langs[n]) langs[n] = {name:n, color:e.node.color||'#8b949e', size:0};
                langs[n].size += e.size;
              });
            });
            const total = Object.values(langs).reduce((a,b) => a+b.size, 0);
            const top = Object.values(langs)
              .sort((a,b) => b.size - a.size)
              .slice(0,6)
              .map(l => ({...l, percent: Math.round(l.size/total*100*10)/10}));
            fs.writeFileSync('manim/stats_data.json', JSON.stringify({
              username: process.env.USERNAME,
              name: data.data.user.name || process.env.USERNAME,
              bio: data.data.user.bio || 'Developer',
              languages: top
            }));
          "
      
      - name: Render with Docker Compose
        run: docker compose up --build manim
      
      - name: Move output file
        run: |
          mv manim/media/videos/solar_system/1080p60/GitHubSolarSystem.mp4 manim/stats.mp4
      
      - name: Convert to GIF
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          ffmpeg -i manim/stats.mp4 \
                 -vf "fps=30,scale=1200:-1:flags=lanczos,split[s0][s1];[s0]palettegen=max_colors=128[p];[s1][p]paletteuse=dither=bayer" \
                 -loop 0 \
                 manim/stats.gif
      
      - name: Prepare Pages output
        run: |
          mkdir -p _site
          cp manim/stats.gif _site/
          cat > _site/index.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>GitHub Stats - ${{ github.event.inputs.username }}</title>
            <style>
              body { 
                background: #0d1117; 
                color: #c9d1d9;
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
                display: flex; 
                flex-direction: column;
                justify-content: center; 
                align-items: center; 
                min-height: 100vh; 
                margin: 0; 
                padding: 20px;
              }
              h1 { margin-bottom: 20px; }
              img { max-width: 100%; height: auto; border-radius: 8px; }
              .container { text-align: center; }
            </style>
          </head>
          <body>
            <div class="container">
              <h1>@${{ github.event.inputs.username }}</h1>
              <img src="stats.gif" alt="GitHub Language Stats Animation">
            </div>
          </body>
          </html>
          EOF
      
      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4